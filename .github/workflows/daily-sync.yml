# Daily Sync Workflow
# Scheduled job that syncs modified Companies and Contacts
# Runs as a backup to webhook-based syncing

name: Daily Sync

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync (ignore last sync time)'
        required: false
        type: boolean
        default: false
      companies_only:
        description: 'Only sync companies'
        required: false
        type: boolean
        default: false
      contacts_only:
        description: 'Only sync contacts'
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hours for large syncs
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Build sync command
        id: build-command
        run: |
          CMD="python scripts/daily_sync.py"
          
          if [ "${{ github.event.inputs.full_sync }}" == "true" ]; then
            CMD="$CMD --full"
          fi
          
          if [ "${{ github.event.inputs.companies_only }}" == "true" ]; then
            CMD="$CMD --companies-only"
          fi
          
          if [ "${{ github.event.inputs.contacts_only }}" == "true" ]; then
            CMD="$CMD --contacts-only"
          fi
          
          echo "command=$CMD" >> $GITHUB_OUTPUT
      
      - name: Run Daily Sync
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ${{ steps.build-command.outputs.command }}
      
      - name: Summary
        if: always()
        run: |
          echo "## Daily Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Full sync**: ${{ github.event.inputs.full_sync || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
